name: Build patches

on:
  push:
    branches: [patches]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: burrunan/gradle-cache-action@v2

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show built files
        run: ls -la patches/build/libs/

      - name: Publish patches to Releases (tag "patches-latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(ls patches/build/libs/*.rvp | head -n 1)
          cp "$FILE" ytmusic-byfilipp-patches.rvp
          gh release delete patches-latest --yes --cleanup-tag || true
          gh release create patches-latest ytmusic-byfilipp-patches.rvp \
            --target "${{ github.sha }}" \
            --title "Последняя сборка патчей" \
            --notes "Файл патчей (.rvp) из ветки patches, коммит ${{ github.sha }}" \
            --prerelease
